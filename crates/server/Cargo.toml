[package]
name = "server"
description = "fenrir-server: management server and web UI host for Fenrir-Backup"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "fenrir-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
argon2 = { version = "0.5", features = ["std", "password-hash"] }
axum = { version = "0.8", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
base64.workspace = true
clap.workspace = true
getrandom.workspace = true
hex.workspace = true
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls", "ring", "webpki-roots"] }
protocol.workspace = true
rcgen = "0.13"
rusqlite = { version = "0.43", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
uuid.workspace = true
x509-parser = "0.16"

[dev-dependencies]
http-body-util = "0.1"
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
