name: CI

on:
  push:
    branches-ignore: [agent-builds]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: QEMU, OVMF and a CirrOS image (VHDX interop + boot-from-backup tests)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-utils qemu-system-x86 ovmf libhivex-bin libwin-hivex-perl
          sudo chmod 666 /dev/kvm || true
          # Same pinned image from either host; the checksum decides.
          for url in \
            https://github.com/cirros-dev/cirros/releases/download/0.6.2/cirros-0.6.2-x86_64-disk.img \
            https://download.cirros-cloud.net/0.6.2/cirros-0.6.2-x86_64-disk.img; do
            if curl -fsSL --retry 3 --connect-timeout 20 -o /tmp/cirros.img "$url" \
               && echo "${CIRROS_SHA256}  /tmp/cirros.img" | sha256sum -c; then
              qemu-img convert -O raw /tmp/cirros.img /tmp/cirros.raw
              echo "FENRIR_TEST_BOOT_IMAGE=/tmp/cirros.raw" >> "$GITHUB_ENV"
              break
            fi
          done
          if [ ! -f /tmp/cirros.raw ]; then
            echo "::warning::CirrOS image unavailable; the boot-from-backup test is skipped in this run"
          fi
        env:
          CIRROS_SHA256: 07e44a73e54c94d988028515403c1ed762055e01b83a767edf3c2b387f78ce00
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: test
        run: cargo test --workspace --locked

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  # The VSS path needs real Windows with admin rights; GitHub's Windows
  # runners have both. Imaging the whole runner disk would take too long,
  # so this takes a real VSS snapshot set with writers, reads NTFS bitmaps,
  # resolves pagefile extents, probe-reads every partition through the
  # shadow devices, then aborts. It exercises all the hand-written FFI.
  # Full backup/restore of Windows guests and Hyper-V hosts runs in the VM
  # matrix (docs/TESTING.md).
  windows-vss-smoke:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p cli -p agent --locked
      - name: disk layout (diagnostics)
        shell: pwsh
        run: |
          Get-Disk | Format-Table Number, FriendlyName, Size, LogicalSectorSize, PartitionStyle -AutoSize
          Get-Partition | Format-Table DiskNumber, PartitionNumber, DriveLetter, Offset, Size, Type -AutoSize
          Get-Volume | Format-Table DriveLetter, FileSystem, Size, SizeRemaining -AutoSize
      - name: backup system --dry-run (VSS)
        shell: pwsh
        run: |
          .\target\release\fenrir-backup.exe --json backup system --dry-run | Tee-Object -FilePath plan.json
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 10) { exit 1 }
          $p = Get-Content plan.json | ConvertFrom-Json
          if (-not $p.ok) { exit 1 }
          $snap = $p.result.disks.partitions | Where-Object { $_.capture -eq 'snapshot_bitmap' }
          if (-not $snap) { Write-Error 'no partition was captured through a VSS snapshot'; exit 1 }
      - name: whole-disk restore on Windows (volumes locked; storage drivers prepared)
        shell: pwsh
        run: ./ci/windows-disk-restore.ps1 -Cli target/release/fenrir-backup.exe -Agent target/release/fenrir-backup-agent.exe

  # Agent, CLI and server binaries for every platform the server offers
  # downloads for. Linux builds are static (musl) so one binary runs on
  # any distribution.
  build:
    name: build (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bins: "-p agent -p cli -p server", ext: ".exe" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, bins: "-p agent -p cli -p server", ext: "", musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, bins: "-p agent -p cli", ext: "", musl: true }
          - { os: macos-latest, target: aarch64-apple-darwin, bins: "-p agent -p cli", ext: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, bins: "-p agent -p cli", ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.bins }}
      - name: collect
        shell: bash
        run: |
          mkdir -p out
          for b in fenrir-backup-agent fenrir-backup fenrir-server; do
            f="target/${{ matrix.target }}/release/$b${{ matrix.ext }}"
            if [ -f "$f" ]; then cp "$f" out/; fi
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: out

  # The recovery ISO (Debian stable live image with the static agent and
  # CLI): recovery-env/build.sh. See docs/design/phase-2.md.
  recovery-iso:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-x86_64-unknown-linux-musl
          path: bin
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y mmdebstrap squashfs-tools xorriso mtools dosfstools
      - name: build
        run: |
          chmod +x bin/*
          sudo recovery-env/build.sh "$PWD/out/fenrir-recovery.iso" bin/fenrir-backup-agent bin/fenrir-backup
          sudo chown -R "$USER" out
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-iso
          path: out

  # S3 storage with Object Lock against a real MinIO server (signatures,
  # create-only writes, locks enforced): the backend's own tests and a CLI
  # repository end to end.
  s3-minio:
    needs: test
    runs-on: ubuntu-latest
    env:
      MINIO_ROOT_USER: fenrir-ci
      MINIO_ROOT_PASSWORD: fenrir-ci-secret-key
      FENRIR_TEST_S3_KEY: fenrir-ci
      FENRIR_TEST_S3_SECRET: fenrir-ci-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: MinIO
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/minio" https://dl.min.io/server/minio/release/linux-amd64/minio
          chmod +x "$RUNNER_TEMP/minio"
          "$RUNNER_TEMP/minio" --version
          echo "MINIO=$RUNNER_TEMP/minio" >> "$GITHUB_ENV"
      - name: S3 backend and CLI on MinIO
        run: |
          export FENRIR_TEST_S3="$PWD/ci/minio-start.sh"
          cargo test --locked -p s3store --test emulator -- --nocapture
          cargo test --locked -p cli --test cli s3_ -- --nocapture
      - name: server and agent on MinIO with Object Lock, end to end
        run: |
          cargo build --locked -p server -p agent
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q httpx cryptography boto3
          ./ci/minio-start.sh 19000 > /tmp/minio.log 2>&1 &
          for i in $(seq 1 30); do curl -s http://127.0.0.1:19000/minio/health/live && break; sleep 1; done
          /tmp/venv/bin/python ci/e2e-s3.py /tmp/e2e-s3 target/debug/fenrir-server target/debug/fenrir-backup-agent http://127.0.0.1:19000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
      - name: logs
        if: failure()
        run: tail -n 60 /tmp/e2e-s3/*.log /tmp/minio.log || true

  # Windows PE recovery media, built the way a user builds it: the Windows
  # ADK and its Windows PE add-on installed on a Windows machine, then
  # recovery-env/winpe/New-FenrirWinPE.ps1 with the Windows agent and CLI.
  winpe-media:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-x86_64-pc-windows-msvc
          path: bin
      - name: Windows ADK and Windows PE add-on
        shell: pwsh
        run: |
          # The community feed fails now and then: retry each package, then
          # check the ADK is really there.
          foreach ($p in 'windows-adk-deploy', 'windows-adk-winpe') {
            for ($i = 1; $i -le 4; $i++) {
              choco install $p -y --no-progress
              if (choco list --exact $p --limit-output) { break }
              Start-Sleep -Seconds (30 * $i)
            }
          }
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\10\Assessment and Deployment Kit"
          foreach ($f in 'Deployment Tools\DandISetEnv.bat', 'Windows Preinstallation Environment\copype.cmd') {
            if (-not (Test-Path "$kit\$f")) { throw "ADK not installed: $f missing" }
          }
      - name: build the media
        shell: pwsh
        run: |
          New-Item -ItemType Directory drivers | Out-Null
          '{"server":"https://backup.example.lan:8443","pin":"","token":"ci","expires":0}' | Set-Content settings.json
          ./recovery-env/winpe/New-FenrirWinPE.ps1 -Agent bin/fenrir-backup-agent.exe -Cli bin/fenrir-backup.exe -Settings settings.json -Out out/fenrir-recovery-winpe.iso
      - name: check the image
        shell: pwsh
        run: |
          $iso = (Resolve-Path out/fenrir-recovery-winpe.iso).Path
          $v = Mount-DiskImage -ImagePath $iso -PassThru | Get-Volume
          $d = "$($v.DriveLetter):"
          if (-not (Test-Path "$d\fenrir\recovery.json")) { throw 'settings missing from the media' }
          New-Item -ItemType Directory mnt | Out-Null
          dism /Mount-Image /ImageFile:"$d\sources\boot.wim" /Index:1 /MountDir:"$PWD\mnt" /ReadOnly
          foreach ($f in 'Windows\System32\fenrir-backup-agent.exe', 'Windows\System32\fenrir-backup.exe', 'Windows\System32\startnet.cmd', 'fenrir\status.cmd') {
            if (-not (Test-Path "mnt\$f")) { throw "$f missing from boot.wim" }
          }
          if (-not (Select-String -Path mnt\Windows\System32\startnet.cmd -Pattern 'fenrir-backup-agent.exe recovery' -Quiet)) { throw 'startnet.cmd does not start the agent' }
          dism /Unmount-Image /MountDir:"$PWD\mnt" /Discard
          Dismount-DiskImage -ImagePath $iso | Out-Null
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-winpe-ci
          path: out
          retention-days: 3

  # Bare-metal restore end to end: the server personalises the ISO, which
  # boots in QEMU with Secure Boot, enrols, and restores a backed-up UEFI
  # disk onto a blank larger disk that then boots by itself.
  recovery-e2e:
    needs: recovery-iso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: recovery-iso
          path: iso
      - name: tools
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf grub-efi-amd64-bin dosfstools mtools fdisk
          sudo chmod 666 /dev/kvm || true
      - name: build
        run: cargo build --release --locked -p server -p agent
      - name: run
        run: |
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q httpx cryptography
          sudo /tmp/venv/bin/python ci/e2e-recovery.py /tmp/e2e-recovery target/release/fenrir-server target/release/fenrir-backup-agent iso/fenrir-recovery.iso
      - name: logs
        if: failure()
        run: |
          sudo tail -n 60 /tmp/e2e-recovery/*.log || true
          sudo sh -c 'tail -c 4000 /tmp/e2e-recovery/*.serial' | tr -d '\r' || true

  # Live image of a running Linux system: real LVM on a loop disk, mounted
  # and written to during the backup (docs/design/phase-6.md).
  live-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y lvm2 fdisk e2fsprogs util-linux
      - name: build
        run: cargo build --release --locked -p cli
      - name: run
        run: sudo ci/e2e-live-linux.sh /tmp/e2e-live target/release/fenrir-backup
      - name: state
        if: failure()
        run: |
          sudo lsblk -o NAME,TYPE,FSTYPE,MOUNTPOINT,SIZE || true
          sudo lvs -a || true

  # Server bundles: fenrir-server + web UI + agent builds for every
  # platform and the recovery ISO, ready to unpack and run. SHA256SUMS covers
  # every file.
  bundle:
    needs: [build, ui, recovery-iso]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: assemble
        run: |
          set -eu
          for os in linux-x64 windows-x64; do
            d="fenrir-server-$os"
            mkdir -p "$d/agents"
            if [ "$os" = linux-x64 ]; then cp art/bin-x86_64-unknown-linux-musl/fenrir-server "$d/"; chmod +x "$d/fenrir-server"
            else cp art/bin-x86_64-pc-windows-msvc/fenrir-server.exe "$d/"; fi
            cp -r art/ui-dist "$d/ui"
            for t in x86_64-pc-windows-msvc x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin; do
              mkdir -p "$d/agents/$t"
              cp art/bin-$t/fenrir-backup-agent* "$d/agents/$t/"
              chmod +x "$d/agents/$t/"* || true
            done
            mkdir -p "$d/agents/recovery"
            cp art/recovery-iso/fenrir-recovery.iso art/recovery-iso/fenrir-recovery.iso.packages "$d/agents/recovery/"
            (cd "$d" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          done
          tar czf fenrir-server-linux-x64.tar.gz fenrir-server-linux-x64
          zip -qr fenrir-server-windows-x64.zip fenrir-server-windows-x64
          sha256sum fenrir-server-*.tar.gz fenrir-server-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fenrir-server-bundles
          path: |
            fenrir-server-linux-x64.tar.gz
            fenrir-server-windows-x64.zip

  # Agent builds that cannot be made inside the Docker image (macOS needs a
  # Mac), published to the `agent-builds`
  # branch: one commit, replaced on every successful run. Servers fetch it
  # with scripts/server-sync (same read-only deploy key as the code).
  publish-agents:
    needs: [test, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/zealous-pascal-c68e5c')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-agents
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: art
      - name: assemble
        run: |
          set -eu
          mkdir -p pub
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            mkdir -p "pub/$t"
            cp art/bin-$t/fenrir-backup-agent* "pub/$t/"
            chmod +x "pub/$t/"*
          done
          printf 'Agent builds from %s@%s (CI run %s). Generated; do not edit.\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" > pub/README.txt
          (cd pub && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat pub/SHA256SUMS
      - name: push to agent-builds
        working-directory: pub
        run: |
          set -eu
          git init -q -b agent-builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Agent builds from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" agent-builds

  # Builds the server image from the Dockerfile (not published).
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fenrir-server:ci
      - name: smoke test
        run: |
          docker run -d --name fenrir -p 8443:8443 fenrir-server:ci
          for i in $(seq 1 30); do curl -fsk https://127.0.0.1:8443/healthz && break; sleep 1; done
          curl -fsk https://127.0.0.1:8443/api/status | grep -q '"setup_required":true'
          docker stop -t 15 fenrir
      - name: export the Windows agent built into the image
        run: |
          id=$(docker create fenrir-server:ci)
          mkdir -p win-agent
          docker cp "$id:/opt/fenrir/agents/x86_64-pc-windows-msvc/fenrir-backup-agent.exe" win-agent/
          docker rm "$id"
          sha256sum win-agent/fenrir-backup-agent.exe
      - uses: actions/upload-artifact@v4
        with:
          name: image-windows-agent
          path: win-agent

  # The Windows installer, end to end on a real Windows machine: server with
  # a self-signed certificate, the agent build the Docker image serves, the
  # exact one-line command the UI shows run in Windows PowerShell 5.1, then
  # the downloadable script (reinstall). Expect a running service and the
  # machine online in the server.
  windows-installer:
    needs: docker
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p server --locked
      - uses: actions/download-artifact@v4
        with:
          name: image-windows-agent
          path: agents/x86_64-pc-windows-msvc
      - name: installers, setup program and network share, end to end
        shell: pwsh
        run: |
          $env:FENRIR_LISTEN = '127.0.0.1:8443'
          $env:FENRIR_DATA_DIR = "$PWD\srv"
          $env:FENRIR_AGENTS_DIR = "$PWD\agents"
          $env:FENRIR_PUBLIC_URL = 'https://127.0.0.1:8443'
          $srv = Start-Process -FilePath .\target\release\fenrir-server.exe -RedirectStandardError server.err -RedirectStandardOutput server.out -PassThru
          $up = $false
          for ($i = 0; $i -lt 60 -and -not $up; $i++) {
            if ($srv.HasExited) { break }
            try { Invoke-RestMethod -SkipCertificateCheck https://127.0.0.1:8443/healthz | Out-Null; $up = $true } catch { Start-Sleep 1 }
          }
          if (-not $up) {
            Write-Host "server exited: $($srv.HasExited) code: $($srv.ExitCode)"
            Get-Content server.out, server.err -ErrorAction SilentlyContinue
            throw 'the server did not start'
          }
          $b = 'https://127.0.0.1:8443'
          $h = @{ 'X-Fenrir-Csrf' = '1' }
          Invoke-RestMethod -SkipCertificateCheck -Method Post "$b/api/setup" -ContentType application/json `
            -Body (@{ username = 'admin'; password = 'ci password for the installer test' } | ConvertTo-Json) -SessionVariable s | Out-Null
          $tok = (Invoke-RestMethod -SkipCertificateCheck -WebSession $s -Headers $h -Method Post "$b/api/enrollment-tokens" `
            -ContentType application/json -Body (@{ label = 'ci'; role = 'workstation' } | ConvertTo-Json)).token
          $cat = Invoke-RestMethod -SkipCertificateCheck -WebSession $s "$b/api/downloads?token=$tok"
          $win = $cat.platforms | Where-Object id -eq 'windows'
          if (-not $win.available) { throw 'the Windows agent is not offered' }
          Write-Host "command: $($win.command)"
          # As pasted into a PowerShell window.
          Set-Content -Encoding ascii one-liner.ps1 $win.command
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\one-liner.ps1
          if ($LASTEXITCODE -ne 0) { throw "installer exited with $LASTEXITCODE" }
          if ((Get-Service FenrirBackupAgent).Status -ne 'Running') { throw 'service not running' }
          for ($i = 0; $i -lt 60; $i++) {
            $a = Invoke-RestMethod -SkipCertificateCheck -WebSession $s "$b/api/agents"
            if (@($a | Where-Object online).Count -ge 1) { Write-Host "online: $($a[0].name) $($a[0].os.name)"; break }
            Start-Sleep 2
          }
          if (@($a | Where-Object online).Count -lt 1) { Get-Content C:\ProgramData\Fenrir-Backup\agent\agent.log -ErrorAction SilentlyContinue; throw 'agent did not come online' }
          # The downloadable script, run as the UI instructs (reinstall over the running agent).
          Invoke-WebRequest -SkipCertificateCheck "$b/install/$tok/windows" -OutFile install-fenrir-backup.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install-fenrir-backup.ps1
          if ($LASTEXITCODE -ne 0) { throw "script installer exited with $LASTEXITCODE" }
          if ((Get-Service FenrirBackupAgent).Status -ne 'Running') { throw 'service not running after reinstall' }
          # Uninstall, then a fresh install with the setup program (silent).
          & 'C:\Program Files\Fenrir-Backup\fenrir-backup-agent.exe' uninstall --yes
          if ($LASTEXITCODE -ne 0) { throw "uninstall exited with $LASTEXITCODE" }
          if (Get-Service FenrirBackupAgent -ErrorAction SilentlyContinue) { throw 'service still present after uninstall' }
          Start-Sleep 8
          if (Test-Path 'C:\Program Files\Fenrir-Backup') { throw 'program folder left behind' }
          Invoke-WebRequest -SkipCertificateCheck $win.setup_url -OutFile Fenrir-Backup-Setup.exe
          $p = Start-Process -FilePath .\Fenrir-Backup-Setup.exe -ArgumentList '/quiet' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Fenrir-Backup-Setup.exe exited with $($p.ExitCode)" }
          if ((Get-Service FenrirBackupAgent).Status -ne 'Running') { throw 'service not running after Fenrir-Backup-Setup.exe' }
          # The new identity works: the agent reaches the server with it.
          & 'C:\Program Files\Fenrir-Backup\fenrir-backup-agent.exe' status
          if ($LASTEXITCODE -ne 0) { throw 'agent status failed after Fenrir-Backup-Setup.exe' }
          $installed = (Get-FileHash 'C:\Program Files\Fenrir-Backup\fenrir-backup-agent.exe').Hash
          $built = (Get-FileHash agents\x86_64-pc-windows-msvc\fenrir-backup-agent.exe).Hash
          if ($installed -ne $built) { throw 'installed agent differs from the server build (settings block not removed)' }
          Write-Host 'Fenrir-Backup-Setup.exe: installed, enrolled, reachable; installed agent identical to the server build'

          # Network share repository: a local SMB share that only a dedicated
          # account may use; the sign-in is sealed to the agent like the UI does.
          $pw = 'Fenrir-' + [guid]::NewGuid().ToString('N').Substring(0, 12) + '!a1'
          New-LocalUser -Name fenrirbk -Password (ConvertTo-SecureString $pw -AsPlainText -Force) -PasswordNeverExpires | Out-Null
          New-Item -ItemType Directory C:\fenrir-share | Out-Null
          icacls C:\fenrir-share /grant 'fenrirbk:(OI)(CI)F' | Out-Null
          New-SmbShare -Name fenrir -Path C:\fenrir-share -FullAccess fenrirbk | Out-Null
          $unc = "\\$env:COMPUTERNAME\fenrir\repo"
          $ag = (Invoke-RestMethod -SkipCertificateCheck -WebSession $s "$b/api/agents") | Where-Object online | Select-Object -First 1
          function Seal($text) { (node ci/seal.mjs $ag.public_key $text) | ConvertFrom-Json }
          function Wait-Job($id) {
            for ($i = 0; $i -lt 90; $i++) {
              $j = Invoke-RestMethod -SkipCertificateCheck -WebSession $s "$b/api/jobs/$id"
              if ($j.state -in 'succeeded', 'warning', 'failed', 'cancelled') { return $j }
              Start-Sleep 2
            }
            throw "job $id did not finish"
          }
          function Signin($password) { Seal (@{ domain = $env:COMPUTERNAME; username = 'fenrirbk'; password = $password } | ConvertTo-Json -Compress) }
          $post = @{ SkipCertificateCheck = $true; WebSession = $s; Headers = $h; Method = 'Post'; ContentType = 'application/json' }
          # Wrong password: a clear message.
          $j = Invoke-RestMethod @post "$b/api/agents/$($ag.id)/check-access" -Body (@{ path = $unc; sealed_share = (Signin 'wrong') } | ConvertTo-Json -Depth 5)
          $r = Wait-Job $j.id
          Write-Host "wrong password: $($r.state): $($r.error)"
          if ($r.state -ne 'failed' -or $r.error -notmatch 'wrong username or password') { throw 'expected a wrong-password failure' }
          # Right password: writable, free space reported.
          $j = Invoke-RestMethod @post "$b/api/agents/$($ag.id)/check-access" -Body (@{ path = $unc; sealed_share = (Signin $pw) } | ConvertTo-Json -Depth 5)
          $r = Wait-Job $j.id
          Write-Host "right password: $($r.state) $($r.result | ConvertTo-Json -Compress)"
          if ($r.state -ne 'succeeded' -or -not $r.result.writable -or -not ($r.result.free_bytes -gt 0)) { throw 'expected a writable share' }
          # A repository on the share, created and verified through the sign-in.
          $repoId = [guid]::NewGuid().ToString()
          $rk = @{ format = 'fenrir-recovery-key'; version = 1; repo_id = $repoId; slot_id = [guid]::NewGuid().ToString(); key = [Convert]::ToBase64String((1..32 | ForEach-Object { Get-Random -Maximum 256 } | ForEach-Object { [byte]$_ })) } | ConvertTo-Json
          $secret = @{ passphrase = 'share repository passphrase'; recovery_key = $rk } | ConvertTo-Json -Compress
          $body = @{ name = 'NAS'; path = $unc; repo_uuid = $repoId; init_agent_id = $ag.id; share_auth = 'password'; share_user = "$env:COMPUTERNAME\fenrirbk"
                     access = @(@{ agent_id = $ag.id; sealed = (Seal $secret); sealed_share = (Signin $pw) }) } | ConvertTo-Json -Depth 6
          $repo = Invoke-RestMethod @post "$b/api/repositories" -Body $body
          $r = Wait-Job $repo.init_job_id
          if ($r.state -ne 'succeeded') { throw "creating the repository on the share failed: $($r.error)" }
          if (-not (Test-Path C:\fenrir-share\repo\config.json)) { throw 'no repository on the share' }
          $j = Invoke-RestMethod @post "$b/api/agents/$($ag.id)/jobs" -Body (@{ kind = @{ type = 'verify'; level = 'quick' }; repository_id = $repo.id } | ConvertTo-Json -Depth 5)
          $r = Wait-Job $j.id
          if ($r.state -ne 'succeeded') { throw "verify on the share failed: $($r.error)" }
          Write-Host 'Share repository: wrong password reported, sign-in works, repository created and verified on \\host\share'
      - name: logs
        if: always()
        shell: pwsh
        run: |
          Get-Content server.out, server.err -Tail 40 -ErrorAction SilentlyContinue
          Get-Content C:\ProgramData\Fenrir-Backup\agent\agent.log -Tail 30 -ErrorAction SilentlyContinue

  # NAS gateway end to end: the real server and two real agents (the second
  # with its own machine-id), backing up through the relay and then directly.
  gateway-e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --locked -p server -p agent
      - name: run
        run: |
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q httpx cryptography
          sudo /tmp/venv/bin/python ci/e2e-gateway.py /tmp/e2e target/debug/fenrir-server target/debug/fenrir-backup-agent
      - name: logs
        if: failure()
        run: sudo tail -n 80 /tmp/e2e/*.log

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit
        run: cargo audit
      - name: cargo deny (licences, sources, advisories)
        run: cargo deny check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (UI)
        working-directory: ui
        run: npm ci && npm audit --omit=dev --audit-level=high

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: fuzz each target briefly
        working-directory: fuzz
        run: |
          for t in manifest_envelope sealed_object partition_table key_files; do
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=60 -rss_limit_mb=2048
          done
